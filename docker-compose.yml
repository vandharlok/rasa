version: '3.8'

services:
  rasa:
    build: .
    volumes:
      - .:/app
    ports:
      - "5005:5005"
    depends_on:
      - duckling
      - backend
      - db
    environment:
      - DATABASE_URL=postgresql://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE}
    networks:
      - app-network
  
  duckling:
    image: rasa/duckling
    ports:
      - "8000:8000"
    networks:
      - app-network

  backend:
    build: ../backend-main
    ports:
      - "3010:3010"
    volumes:
      - ../backend-main:/app
    environment:
      - NODE_ENV=production
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DATABASE=${PG_DATABASE}
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build:
      context: ../chatbot
    ports:
      - "3001:3001" 
    volumes:
      - ../chatbot:/app
    depends_on:
      - rasa
      - backend
    networks:
      - app-network

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  action-server:
    build:
      context: .
      dockerfile: Dockerfile.actions
    ports:
      - "5055:5055"
    volumes:
      - ./actions:/app/actions
    networks:
      - app-network

  ngrok:
    image: wernight/ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN} 
      - NGROK_PORT=frontend:3001 
    ports:
      - "4040:4040" 
    depends_on:
      - frontend
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
